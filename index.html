<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Management System</h1>
    <p>Simple demo for Git Feature Branches</p>
  </header>

  <main>
    <!-- Student Registration Module -->
    <section class="card" id="registration">
      <h2>Student Registration</h2>
      <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter student name" required>

        <label>Roll No:</label>
        <input type="text" placeholder="Enter roll number" required>

        <label>Course:</label>
        <select>
          <option>BCA</option>
          <option>B.Tech</option>
          <option>MCA</option>
        </select>

        <button type="submit">Register Student</button>
      </form>
    </section>

    <!-- Student Result Module -->
    <section class="card" id="result">
      <h2>Student Result</h2>
      <form>
        <label>Roll No:</label>
        <input type="text" placeholder="Enter roll number" required>

        <label>Marks:</label>
        <input type="number" placeholder="Enter marks" required>

        <button type="submit">Save Result</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Created using Git Feature Branches</p>
  </footer>
</body>
</html>
